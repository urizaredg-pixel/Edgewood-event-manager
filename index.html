<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- App Settings -->
  <title>Edgewood Event Manager</title>

  <meta name="theme-color" content="#101820">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="Edgewood Events">

  <!-- App Icon -->
  <link rel="icon" type="image/png" href="icon.png">

  <link rel="apple-touch-icon" href="icon.png">

  <!-- Android App Manifest -->
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101820;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 500px;
    }

    .logo {
      width: 180px;
      max-width: 60%;
      border-radius: 25px;
      margin-bottom: 25px;
      box-shadow: 0 8px 25px rgba(0,0,0,.4);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 32px;
    }

    p {
      color: #cccccc;
      font-size: 17px;
      line-height: 1.5;
    }

    .open-button {
      display: inline-block;
      margin-top: 25px;
      padding: 18px 35px;
      background: #b5121b;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
    }
  </style>
</head>

<body>

  <div class="container">

    <img src="icon.png" class="logo" alt="Edgewood Engine Company No. 6">

    <h1>Edgewood Event Manager</h1>

    <p>
      Edgewood Engine Company No. 6
      <br>
      Brentwood, New York
    </p>

    <a
      class="open-button"
      href="https://script.google.com/macros/s/AKfycbyanwCx1hYDRaSNkbwmp2V4OflGRi5X5qqMSv-Jo3ZJxkL22by78CgxCqI8bbZ-1IeAwA/exec?page=eventmanager"
      Open Event Manager
    </a>

  </div>

</body>
</html>
